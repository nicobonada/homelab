---
# href / siteMonitor / widget urls use HOMEPAGE_VAR_* (see secrets.env.example).
# Real hosts/IPs live in 1Password Environment Homelab — not in this public tree.
# server/container = Docker status via docker.yaml → local socket

- Lab:
    - Proxmox:
        icon: sh-proxmox
        href: "{{HOMEPAGE_VAR_PVE_URL}}"
        description: Hypervisor
        siteMonitor: "{{HOMEPAGE_VAR_PVE_URL}}"
        # Token currently homepage@pam!… — recreate under @pve when convenient
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PVE_URL}}"
          username: "{{HOMEPAGE_VAR_PVE_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PVE_SECRET}}"
          node: pve
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

    - Technitium:
        icon: sh-technitium
        href: "{{HOMEPAGE_VAR_DNS_URL}}"
        description: DNS / ad blocking
        siteMonitor: "{{HOMEPAGE_VAR_TECHNITIUM_HTTP}}"
        # Token: user homepage / name homelab-dashboard; secret in Homelab env
        widget:
          type: technitium
          url: "{{HOMEPAGE_VAR_TECHNITIUM_HTTP}}"
          key: "{{HOMEPAGE_VAR_TECHNITIUM_KEY}}"
          range: LastDay
          fields: ["totalQueries", "totalBlocked", "totalCached", "totalClients"]

    - Gatus:
        icon: sh-gatus
        href: "{{HOMEPAGE_VAR_STATUS_URL}}"
        description: Monitor status
        siteMonitor: "{{HOMEPAGE_VAR_GATUS_HTTP}}"
        server: local
        container: gatus
        showStats: true
        widget:
          type: gatus
          url: "{{HOMEPAGE_VAR_GATUS_HTTP}}"

- Apps:
    - Grimmory:
        icon: sh-booklore
        href: "{{HOMEPAGE_VAR_BOOKS_URL}}"
        description: Ebooks
        siteMonitor: "{{HOMEPAGE_VAR_GRIMMORY_HTTP}}"
        server: local
        container: grimmory
        showStats: true

    - Papra:
        icon: sh-papra
        href: "{{HOMEPAGE_VAR_DOCS_URL}}"
        description: Documents
        siteMonitor: "{{HOMEPAGE_VAR_PAPRA_HTTP}}"
        server: local
        container: papra
        showStats: true

    - Homepage:
        icon: homepage.png
        href: "{{HOMEPAGE_VAR_DASHBOARD_URL}}"
        description: This dashboard
        siteMonitor: "{{HOMEPAGE_VAR_HOMEPAGE_HTTP}}"
        server: local
        container: homepage
        showStats: true

- Cloud:
    - Tailscale:
        icon: sh-tailscale
        href: https://login.tailscale.com/admin/machines
        description: VPN / devices
        # Device = lab host; API access token in Homelab env (90d max expiry)
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          fields: ["address", "last_seen", "update_available", "hostname"]

    - Cloudflare:
        icon: sh-cloudflare
        href: https://dash.cloudflare.com/
        description: DNS settings

    - Backblaze:
        icon: sh-backblaze
        href: https://secure.backblaze.com/b2_buckets.htm
        description: B2 / R2 storage
