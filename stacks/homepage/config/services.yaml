---
# hrefs are *.lab.bonada.ca (Caddy). Widget/probe URLs are host.docker.internal
# or loopback — public-safe. Only PVE URL + API tokens stay as HOMEPAGE_VAR_*.
# server/container = Docker status via docker.yaml → local socket
# One group: custom.css wraps .services-list (add/delete here; do not retune columns).

- Services:
    - Proxmox:
        icon: sh-proxmox
        href: "{{HOMEPAGE_VAR_PVE_URL}}"
        description: Hypervisor
        siteMonitor: "{{HOMEPAGE_VAR_PVE_URL}}"
        # Token currently homepage@pam!… — recreate under @pve when convenient
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PVE_URL}}"
          username: "{{HOMEPAGE_VAR_PVE_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PVE_SECRET}}"
          node: pve
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

    - Technitium:
        icon: sh-technitium
        href: https://dns.lab.bonada.ca
        description: DNS / ad blocking
        siteMonitor: http://host.docker.internal:5380
        # Token: user homepage / name homepage-dashboard; secret in Homelab env
        widget:
          type: technitium
          url: http://host.docker.internal:5380
          key: "{{HOMEPAGE_VAR_TECHNITIUM_KEY}}"
          range: LastDay
          fields: ["totalQueries", "totalBlocked", "totalCached", "totalClients"]

    - Syncthing:
        icon: sh-syncthing
        href: https://sync.lab.bonada.ca
        description: File sync hub
        siteMonitor: http://host.docker.internal:8384
        # API key: Actions → Settings → General. href is Caddy.
        widget:
          type: syncthing
          url: http://host.docker.internal:8384
          key: "{{HOMEPAGE_VAR_SYNCTHING_KEY}}"
          fields: ["connected", "synced", "errors", "storage"]

    - Gatus:
        icon: sh-gatus
        href: https://status.lab.bonada.ca
        description: Monitor status
        siteMonitor: http://host.docker.internal:3001
        server: local
        container: gatus
        showStats: true
        widget:
          type: gatus
          url: http://host.docker.internal:3001

    - Grimmory:
        icon: sh-booklore
        href: https://books.lab.bonada.ca/dashboard
        description: Ebooks
        siteMonitor: http://host.docker.internal:6060
        server: local
        container: grimmory
        showStats: true

    - Papra:
        icon: sh-papra
        href: https://docs.lab.bonada.ca/
        description: Documents
        siteMonitor: http://host.docker.internal:1221
        server: local
        container: papra
        showStats: true

    - Homepage:
        icon: homepage.png
        href: https://dashboard.lab.bonada.ca
        description: This dashboard
        # Same-container health endpoint. href is Caddy for the browser.
        siteMonitor: http://127.0.0.1:3000/api/healthcheck
        server: local
        container: homepage
        showStats: true

    - Tailscale:
        icon: sh-tailscale
        href: https://login.tailscale.com/admin/machines
        description: VPN / devices
        # Device = lab host; API access token in Homelab env (90d max expiry)
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"
          fields: ["address", "last_seen", "update_available", "hostname"]
