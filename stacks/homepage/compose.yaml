# Homepage dashboard
# Config in git: ./config (rsync'd to host by scripts/deploy-containers).
# Secrets: secrets.env on the workstation (gitignored); read by local compose client.
# Bind mounts are on the *remote* Docker host when using DOCKER_HOST=ssh://…
services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /home/nico/homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - secrets.env
    environment:
      # Host allowlist — set HOMEPAGE_ALLOWED_HOSTS in Homelab env (→ secrets.env)
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS}
