# Host metrics (Glances) + health checks / status UI (Gatus) for Homepage.
# Gatus config is rsync'd to the lab host by scripts/deploy-containers
# (bind mounts resolve on the remote daemon when DOCKER_HOST=ssh://…).
services:
  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    pid: host
    # Bridge + published port so other containers can reach the API.
    # pid:host still exposes host process/CPU view.
    ports:
      - "61208:61208"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
      - /:/host:ro
    environment:
      GLANCES_OPT: "-w -t 2"
      # Report host root disk via bind mount path inside container
      # (glances sees /host as a mount; Homepage requests disk: /host)

  gatus:
    image: ghcr.io/twin/gatus:stable
    container_name: gatus
    restart: unless-stopped
    # Bridge + publish (same pattern as former Kuma / Glances). Host-network
    # Gatus was not reachable from the Homepage container (widget ETIMEDOUT to
    # the lab tailnet IP). Host port 3001 kept for Serve / bookmarks.
    ports:
      - "3001:8080"
    env_file:
      - .env
    volumes:
      - /home/nico/monitoring/config:/config:ro
      - gatus-data:/data
    # Reach other lab listeners on the host (Homepage, apps, Glances, …).
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  gatus-data:
