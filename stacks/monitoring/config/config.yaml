# Lab health checks. URLs come from env (1P Homelab → stacks/monitoring/.env).
# Co-located apps: host.docker.internal (compose extra_hosts). Remote: MagicDNS.
# See README.
#
# Open follow-up: wire `alerting:` once we pick a notify channel (ntfy, email, …).
# No providers configured yet on purpose.
#
# Always require [CONNECTED] — a failed dial leaves [STATUS] empty, and
# "[STATUS] < 400" would otherwise pass (false green).

storage:
  type: sqlite
  path: /data/gatus.db
  caching: true

# Container listens on 8080; host publish is 3001:8080 (see compose / README).
web:
  port: 8080

ui:
  title: Lab status
  header: Lab
  description: Homelab endpoint health
  dark-mode: true
  default-sort-by: group

# Check interval matches former Kuma 60s monitors.
endpoints:
  - name: homepage
    group: lab
    # Same host the browser uses. host.docker.internal:3000 sends Host that
    # Homepage rejects (400, ALLOWED_HOSTS). Hairpin to Caddy on CADDY_BIND works
    # from this container. Local CA: Gatus tls: is mTLS only, no extra CA file.
    url: https://dashboard.lab.bonada.ca/api/healthcheck
    interval: 60s
    client:
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"

  - name: grimmory
    group: lab
    url: "${GATUS_URL_GRIMMORY}"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"

  - name: papra
    group: lab
    url: "${GATUS_URL_PAPRA}"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"

  - name: netbox
    group: lab
    url: "${GATUS_URL_NETBOX}"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"

  # Co-located: GATUS_URL_GLANCES should be http://glances:61208 (compose DNS).
  # host.docker.internal:61208 hairpins poorly and times out from this container.
  - name: glances
    group: lab
    url: "${GATUS_URL_GLANCES}"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] == 200"

  - name: technitium
    group: infra
    url: "${GATUS_URL_TECHNITIUM}"
    interval: 60s
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"

  - name: proxmox
    group: infra
    url: "${GATUS_URL_PROXMOX}"
    interval: 60s
    client:
      # Lab PVE UI often uses a self-signed cert over Tailscale.
      insecure: true
    conditions:
      - "[CONNECTED] == true"
      - "[STATUS] < 400"
