# Grimmory (books) + MariaDB
# Data dirs stay on the host under /home/nico/grimmory/
# Secrets: 1Password Homelab → .env (gitignored).
services:
  grimmory:
    image: grimmory/grimmory:nightly
    container_name: grimmory
    environment:
      - USER_ID=${APP_USER_ID}
      - GROUP_ID=${APP_GROUP_ID}
      - TZ=${TZ}
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_USERNAME=${DB_USER}
      - DATABASE_PASSWORD=${DB_PASSWORD}
      - BOOKLORE_PORT=${BOOKLORE_PORT}
      # Java4Shell (CVE-2026-114938). Nightly still bundles Temurin
      # 25.0.5+8; Alpine 25.0.5.1 images were not out when this was
      # pulled. Drop once java -version shows 25.0.5.1. Additive
      # JDK_JAVA_OPTIONS so the image JAVA_TOOL_OPTIONS stay.
      - JDK_JAVA_OPTIONS=-XX:-UseBASE64Intrinsics
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "${BOOKLORE_PORT}:${BOOKLORE_PORT}"
    volumes:
      - /home/nico/grimmory/data:/app/data
      - /home/nico/grimmory/books:/books
      - /home/nico/grimmory/bookdrop:/bookdrop
    restart: unless-stopped

  mariadb:
    # 11.8 LTS. Moving off 11.4 upgrades the data directory in place (one-way).
    image: lscr.io/linuxserver/mariadb:11.8.8
    container_name: mariadb
    environment:
      - PUID=${DB_USER_ID}
      - PGID=${DB_GROUP_ID}
      - TZ=${TZ}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
    volumes:
      - /home/nico/grimmory/mariadb/config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
