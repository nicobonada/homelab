# NetBox (DCIM/IPAM) — official netboxcommunity/netbox image
# https://hub.docker.com/r/netboxcommunity/netbox/
# Compose shape follows netbox-docker v5.0.2 (NetBox 4.6).
# Data: named volumes (image runs as uid 999; host binds need root chown).
# Secrets: 1Password Environment Homelab → .env (see .env.example).
# UI: http://<lab>:8000  (container listens on 8080).
services:
  netbox: &netbox
    image: docker.io/netboxcommunity/netbox:v4.6-5.0.2
    container_name: netbox
    restart: unless-stopped
    user: "netbox:root"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${NETBOX_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_CACHE_HOST: redis-cache
      REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      API_TOKEN_PEPPER_1: ${NETBOX_API_TOKEN_PEPPER}
      # First boot creates this admin; later starts leave it in place.
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME}
      SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD}
      ALLOWED_HOSTS: "*"
      CORS_ORIGIN_ALLOW_ALL: "true"
      MEDIA_ROOT: /opt/netbox/netbox/media
      TZ: America/Toronto
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/login/ || exit 1"]
      start_period: 360s
      timeout: 3s
      interval: 15s
    volumes:
      - netbox-media-files:/opt/netbox/netbox/media
      - netbox-reports-files:/opt/netbox/netbox/reports
      - netbox-scripts-files:/opt/netbox/netbox/scripts

  netbox-worker:
    <<: *netbox
    container_name: netbox-worker
    depends_on:
      netbox:
        condition: service_healthy
    ports: []
    command:
      - /opt/netbox/venv/bin/python
      - /opt/netbox/netbox/manage.py
      - rqworker
    healthcheck:
      test: ["CMD-SHELL", "ps -aux | grep -v grep | grep -q rqworker || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s

  postgres:
    image: docker.io/postgres:18-alpine
    container_name: netbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: ${NETBOX_DB_PASSWORD}
    volumes:
      # Postgres 18 image uses /var/lib/postgresql (not .../data).
      - netbox-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -t 2 -d netbox -U netbox"]
      start_period: 20s
      timeout: 30s
      interval: 10s
      retries: 5

  redis:
    image: docker.io/valkey/valkey:9.1-alpine
    container_name: netbox-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - valkey-server --appendonly yes --requirepass $$REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
    volumes:
      - netbox-redis-data:/data
    healthcheck: &redis-healthcheck
      test: ['CMD-SHELL', '[ $$(valkey-cli --pass "$${REDIS_PASSWORD}" ping) = ''PONG'' ]']
      start_period: 5s
      timeout: 3s
      interval: 1s
      retries: 5

  redis-cache:
    image: docker.io/valkey/valkey:9.1-alpine
    container_name: netbox-redis-cache
    restart: unless-stopped
    command:
      - sh
      - -c
      - valkey-server --requirepass $$REDIS_PASSWORD
    environment:
      REDIS_PASSWORD: ${NETBOX_REDIS_CACHE_PASSWORD}
    volumes:
      - netbox-redis-cache-data:/data
    healthcheck: *redis-healthcheck

volumes:
  netbox-media-files:
  netbox-reports-files:
  netbox-scripts-files:
  netbox-postgres:
  netbox-redis-data:
  netbox-redis-cache-data:
