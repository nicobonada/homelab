# OpenBao — secrets engine for app stacks (homepage / grimmory / papra).
# Bootstrap: sops holds unseal key + root token only (see README).
# App env still deploys via secrets/*.env until migration off sops.
#
# Data + config on the Docker host under /home/nico/openbao/ (deploy-containers rsyncs config).
services:
  openbao:
    image: openbao/openbao:2.6.1
    container_name: openbao
    restart: unless-stopped
    ports:
      - "8200:8200"
    # Match host nico on this NixOS VM: uid 1000, primary gid 100 (users).
    # Image entrypoint tries to chown to uid 100; skip that for our bind mounts.
    user: "1000:100"
    environment:
      SKIP_CHOWN: "true"
    volumes:
      - /home/nico/openbao/config:/openbao/config:ro
      - /home/nico/openbao/data:/openbao/file
    # Explicit server mode (image default is -dev when no config is present).
    command: ["server"]
    healthcheck:
      # Image has no wget/curl. `bao status` exits 0 unsealed, 2 sealed/uninit — both mean API is up.
      test:
        [
          "CMD-SHELL",
          "bao status -address=http://127.0.0.1:8200 >/dev/null 2>&1; e=$$?; [ $$e -eq 0 ] || [ $$e -eq 2 ]",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
