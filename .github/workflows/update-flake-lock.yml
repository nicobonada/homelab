name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    # 12:00 UTC on odd calendar dates. GitHub cron has no 48-hour
    # interval, so a month boundary can be one day apart.
    - cron: "0 12 */2 * *"

jobs:
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          # User token, not GITHUB_TOKEN. A pull request opened by
          # github-actions[bot] leaves preflight waiting for approval,
          # and Protect main ignores a workflow_dispatch run of that
          # check. LOCK_UPDATE_TOKEN is a fine-grained token with
          # contents and pull-requests write on nix-config and homelab.
          token: ${{ secrets.LOCK_UPDATE_TOKEN }}
          pr-title: "build(flake): update flake.lock"
          commit-msg: "build(flake): update flake.lock"
          pr-labels: dependencies
          pr-body: |
            Automated `nix flake update` of every flake input.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            This does not remote-switch or deploy Compose. Merge only after `preflight` is green.
