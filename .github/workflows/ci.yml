name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # No id-token: that logs Determinate Nix into FlakeHub Cache via
      # GitHub OIDC, which 401s unless this repo is enrolled in the cache.
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/determinate-nix-action@v3
      - name: Preflight
        run: ./scripts/preflight --eval
